name: iOS PR Validation (GitHub-hosted)

on:
  pull_request:
    branches: [ "*" ]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit and integration tests on GitHub-hosted macOS
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show current version of Xcode
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available --json

      - name: Set Default Scheme
        run: |
          scheme=$(find . -path "*/xcshareddata/xcschemes/*.xcscheme" -print \
            | sed 's#.*/##; s#\.xcscheme$##' \
            | head -n 1)
          if [ -z "$scheme" ]; then
            scheme=$(xcodebuild -list -json | ruby -rjson -e '
              data = JSON.parse(STDIN.read)
              schemes = (data.dig("project", "schemes") || data.dig("workspace", "schemes") || [])
              abort("No Xcode schemes found") if schemes.empty?
              puts schemes.first
            ')
          fi
          echo "$scheme" > default
          echo "Using default scheme: $scheme"

      - name: Select simulator destination
        run: |
          destination=$(xcrun simctl list devices available --json | ruby -rjson -e '
            data = JSON.parse(STDIN.read)
            candidates = []
            (data["devices"] || {}).each do |runtime, devices|
              next unless runtime.include?("iOS")
              devices.each do |d|
                next unless d["isAvailable"]
                next unless d["name"].to_s.start_with?("iPhone")
                next unless d["udid"]
                version = runtime[/iOS[- ](\d+(?:[-_]\d+)*)/, 1].to_s
                version_key = version.split(/[-_]/).map(&:to_i)
                candidates << [version_key, d["name"].to_s, d["udid"].to_s]
              end
            end
            abort("No available iPhone simulators found") if candidates.empty?
            _, _, udid = candidates.max_by { |version_key, name, _| [version_key, name] }
            puts "id=#{udid}"
          ')
          echo "$destination" > destination
          echo "Using destination: $destination"

      - name: Write CI Secrets.xcconfig placeholder
        run: |
          mkdir -p Configs
          cat > Configs/Secrets.xcconfig <<'EOF'
          AMPLITUDE_API_KEY_DEV =
          AMPLITUDE_API_KEY_PROD =
          EOF

      - name: Build and Test (Unit and Integration Tests)
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: |
          scheme="$(cat default)"

          if [ "$(ls -A | grep -i \\.xcworkspace\$)" ]; then
            filetype_parameter="workspace"
            file_to_build="$(ls -A | grep -i \\.xcworkspace\$ | head -n 1)"
          else
            filetype_parameter="project"
            file_to_build="$(ls -A | grep -i \\.xcodeproj\$ | head -n 1)"
          fi

          echo "Building and testing scheme: $scheme"
          echo "Using $filetype_parameter: $file_to_build"

          xcodebuild test \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "$(cat destination)" \
            -only-testing:FamilyMenuPlannerUnitTests \
            -only-testing:FamilyMenuPlannerIntegrationTests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            CODE_SIGNING_ALLOWED=NO
