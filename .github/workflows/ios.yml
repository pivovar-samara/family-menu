name: iOS starter workflow

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      
      - name: Show current version of Xcode
        run: xcodebuild -version
        
      - name: List available simulators
        run: xcrun simctl list devices available --json
        
      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo "Using default scheme: $default"
          
      - name: Build and Test (Unit and Integration Tests)
        env:
          # Set CI environment variables to prevent CloudKit initialization
          CI: "true"
          GITHUB_ACTIONS: "true"
        run: |
          scheme=$(cat default)
          
          # Determine if we have a workspace or project
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then 
            filetype_parameter="workspace"
            file_to_build="`ls -A | grep -i \\.xcworkspace\$`"
          else 
            filetype_parameter="project"
            file_to_build="`ls -A | grep -i \\.xcodeproj\$`"
          fi
          
          echo "Building and testing scheme: $scheme"
          echo "Using $filetype_parameter: $file_to_build"
          
          # Run all test suites including UI tests (self-hosted runner can handle them)
          xcodebuild test \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -destination "platform=iOS Simulator,OS=18.5,name=iPhone 16 Pro" \
            -only-testing:FamilyMenuPlannerUnitTests \
            -only-testing:FamilyMenuPlannerIntegrationTests \
            -only-testing:FamilyMenuPlannerPerformanceTests \
            -only-testing:FamilyMenuPlannerUITests \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO \
